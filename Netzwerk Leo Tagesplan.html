<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Mein Tagesplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600&family=Didact+Gothic&display=swap">
<style>
/* Layout: one narrow column for phones; the plan reads like the printed timetable of the deck. Single light theme, matching the slides. */
:root {
  --paper: #ffffff;
  --ink: #484540;
  --ink-soft: #6b665f;
  --gold: #c7aa62;
  --blue: #495e85;
  --line: #e6e1d6;
  --wash: #f6f3ec;
  --danger: #9b2c2c;
  --display: 'League Spartan', 'Trebuchet MS', Arial, sans-serif;
  --body: 'Didact Gothic', 'Century Gothic', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 48px; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 84px; height: auto; }
.brand p { margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1.35; }
.rule { height: 3px; background: var(--gold); border: 0; margin: 0; }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 40px; line-height: 1.05; text-wrap: balance; }
.lead { margin: 0; color: var(--ink-soft); }
form { display: flex; flex-direction: column; gap: 10px; }
label { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; }
.hint { margin: 0; font-size: 14px; color: var(--ink-soft); }
.row { display: flex; flex-direction: column; gap: 10px; }
input {
  width: 100%; min-height: 56px;
  font-family: var(--display); font-size: 24px; font-weight: 500; letter-spacing: 0.06em;
  padding: 12px 14px; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink);
}
input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button {
  font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.04em;
  min-height: 52px; padding: 12px 20px; border: 2px solid var(--blue); background: var(--blue); color: #ffffff; cursor: pointer; border-radius: 0;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button:active { opacity: .85; }
button.ghost { background: transparent; color: var(--blue); min-height: 44px; padding: 8px 14px; font-size: 16px; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.error { color: var(--danger); margin: 0; font-size: 15px; }
#choose, #result { display: flex; flex-direction: column; gap: 16px; }
#choose h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices button { text-align: left; }
.choices button span { display: block; font-family: var(--body); font-weight: 400; font-size: 15px; letter-spacing: 0; }
.who-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.who-head h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.15; }
.who-head h2 span { color: var(--blue); }
.role { margin: 0; font-size: 15px; color: var(--ink-soft); }
.daynote { margin: 0; padding: 10px 14px; background: var(--wash); border-left: 4px solid var(--gold); font-size: 15px; }
ol.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.slot { display: grid; grid-template-columns: 104px 1fr; gap: 4px 14px; padding: 14px 14px; border: 2px solid var(--blue); transition: opacity .3s; }
.slot time { font-family: var(--display); font-weight: 600; font-size: 17px; color: var(--blue); font-variant-numeric: tabular-nums; padding-top: 2px; }
.slot .what { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.slot .tag { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
.slot .who { font-size: 15px; color: var(--ink-soft); }
.slot h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.2; }
.room { justify-self: start; background: var(--gold); color: #000000; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.slot > .room { grid-column: 2; margin-top: 6px; }
.slot.keynote, .slot.mine { background: var(--blue); color: #ffffff; }
.slot.keynote time, .slot.keynote .tag, .slot.mine time, .slot.mine .tag, .slot.mine .who, .slot.keynote .who { color: #ffffff; }
.slot.quiet { border: 0; border-left: 4px solid var(--gold); padding: 6px 14px; background: transparent; }
.slot.quiet time { font-size: 15px; color: var(--ink); }
.slot.quiet .what { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; justify-content: center; }
.slot.multi { grid-template-columns: 1fr; }
ul.talks b { min-width: 0; }
ul.talks { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; }
ul.talks li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
ul.talks li:first-child { border-top: 0; padding-top: 2px; }
ul.talks b { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; }
ul.talks .who { grid-column: 1; }
ul.talks .room { grid-column: 2; grid-row: 1 / span 2; font-size: 14px; padding: 3px 10px; }
.badge { display: none; grid-column: 1 / -1; justify-self: start; background: var(--gold); color: #000000; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: 0.14em; padding: 3px 10px; border-radius: 999px; margin-bottom: 4px; }
.slot.now .badge { display: inline-block; }
.slot.now { border-width: 4px; border-color: var(--gold); padding: 18px 16px; box-shadow: 0 8px 22px rgba(72, 69, 64, .22); }
.slot.now h3 { font-size: 24px; }
.slot.now time { font-size: 19px; }
.slot.quiet.now { border: 0; border-left: 8px solid var(--gold); background: var(--wash); padding: 14px 16px; box-shadow: none; }
.slot.quiet.now .badge { margin-bottom: 2px; }
.slot.past { opacity: .45; }
footer { font-size: 14px; color: var(--ink-soft); }
@media (max-width: 360px) { .slot { grid-template-columns: 1fr; } .slot > .room { grid-column: 1; } h1 { font-size: 34px; } }
@media (min-width: 600px) { .row { flex-direction: row; } input { flex: 1; width: auto; } }
@media (prefers-reduced-motion: no-preference) { #result:not([hidden]) { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(6px); } to { transform: none; } } }
</style>

const $ = (id) => document.getElementById(id);
const STORE = "bot26-login";
const normalize = (s) => s.toUpperCase().replace(/[\s\-–]/g, "");
const pretty = (n) => n.length === 8 ? n.slice(0, 4) + "-" + n.slice(4) : n;
const minutes = (hm) => { const [h, m] = hm.split(":").map(Number); return h * 60 + m; };
const blockOf = (talk) => Object.keys(BLOCK_TALKS).find((b) => BLOCK_TALKS[b].includes(talk));
const blockName = { b1: "Block I", b2: "Block II", b3: "Block III" };

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function show(section) {
  for (const id of ["lookup", "choose", "result"]) $(id).hidden = id !== section;
}

function remember(value) { try { localStorage.setItem(STORE, value); } catch {} }
function forget() { try { localStorage.removeItem(STORE); } catch {} }

// --- Building the plan ---
// who: { kind: "student", plan } | speaker(...) | team(...)
function slotItem(s, who) {
  const li = el("li", "slot " + s.kind);
  li.dataset.s = minutes(s.s);
  li.dataset.e = minutes(s.e);
  li.appendChild(el("span", "badge", "Läuft gerade"));
  li.appendChild(el("time", null, s.s + " – " + s.e));
  const what = el("div", "what");
  li.appendChild(what);

  if (s.kind === "quiet") { what.textContent = s.label; return li; }

  if (s.kind === "keynote") {
    const own = who.kind === "speaker" && who.keynote;
    what.appendChild(el("span", "tag", own ? "Dein Vortrag · Keynote" : s.tag + " · " + s.speaker));
    what.appendChild(el("h3", null, s.title));
    li.appendChild(el("span", "room", s.room));
    return li;
  }

  // A session slot.
  if (who.kind === "student") {
    const w = WORKSHOPS[who.plan[s.id]];
    what.appendChild(el("span", "tag", s.tag));
    what.appendChild(el("h3", null, w ? w.title : "Noch nicht zugeteilt"));
    if (w) what.appendChild(el("span", "who", "mit " + w.speaker));
    li.appendChild(el("span", "room", w ? w.room : "Raum folgt"));
    return li;
  }
  if (who.kind === "speaker" && blockOf(who.talk) === s.block) {
    const w = WORKSHOPS[who.talk];
    li.classList.add("mine");
    what.appendChild(el("span", "tag", "Dein Vortrag · " + s.tag));
    what.appendChild(el("h3", null, w.title));
    li.appendChild(el("span", "room", w.room));
    return li;
  }
  // Free speaker or team: every talk running in this slot.
  li.classList.add("multi");
  what.appendChild(el("span", "tag", s.tag + " · alle Vorträge"));
  const list = el("ul", "talks");
  for (const t of BLOCK_TALKS[s.block]) {
    const w = WORKSHOPS[t];
    const item = el("li");
    item.appendChild(el("b", null, w.title));
    item.appendChild(el("span", "room", w.room));
    item.appendChild(el("span", "who", w.speaker));
    list.appendChild(item);
  }
  what.appendChild(list);
  return li;
}

function render(heading, accent, roleText, who) {
  const title = $("title");
  title.replaceChildren(document.createTextNode(heading + " "), el("span", null, accent));
  $("role").textContent = roleText || "";
  $("role").hidden = !roleText;
  const list = $("plan");
  list.replaceChildren(...SLOTS.map((s) => slotItem(s, who)));
  show("result");
  updateNow(true);
}

function renderPerson(p) {
  if (p.kind === "team") {
    render("Team-Ansicht:", p.name, "Du siehst in jedem Slot alle laufenden Vorträge.", p);
  } else {
    const w = WORKSHOPS[p.talk];
    const b = blockName[blockOf(p.talk)];
    const own = p.keynote ? "Keynote in der Aula und " + b + " in " + w.room : b + " in " + w.room;
    render("Plan für", p.name, "Dein Vortrag: " + own + ". In den anderen Blöcken siehst du alle Vorträge, die gerade laufen.", p);
  }
}

// --- Highlighting the slot that is running right now ---
const params = new URLSearchParams(location.search);
const simulated = params.get("zeit"); // e.g. ?zeit=10:15 to try the highlight before the day
function nowMinutes() {
  if (simulated && /^\d{1,2}:\d{2}$/.test(simulated)) return minutes(simulated);
  const d = new Date();
  const today = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  return today === EVENT_DATE ? d.getHours() * 60 + d.getMinutes() : null;
}
function updateNow(scroll) {
  const now = nowMinutes();
  let current = null;
  for (const li of $("plan").children) {
    const s = +li.dataset.s, e = +li.dataset.e;
    const isNow = now != null && now >= s && now < e;
    li.classList.toggle("now", isNow);
    li.classList.toggle("past", now != null && now >= e);
    if (isNow) current = li;
  }
  const note = $("daynote");
  const first = minutes(SLOTS[0].s), last = minutes(SLOTS[SLOTS.length - 1].e);
  if (now != null && now < first) { note.textContent = "Der Tag beginnt um 8:15 Uhr mit der Keynote in der Aula."; note.hidden = false; }
  else if (now != null && now >= last) { note.textContent = "Alle Vorträge sind vorbei. Danke fürs Mitmachen!"; note.hidden = false; }
  else note.hidden = true;
  if (scroll && current) {
    // Jump (no smooth scroll) so it also works while fonts are still loading.
    setTimeout(() => current.scrollIntoView({ behavior: "auto", block: "center" }), 300);
  }
}
setInterval(() => { if (!$("result").hidden) updateNow(false); }, 30000);

// --- Login ---
function showChooser(key, people) {
  const box = $("choices");
  box.replaceChildren(...people.map((p, i) => {
    const b = el("button", null, p.name);
    b.type = "button";
    b.appendChild(el("span", null, p.kind === "team" ? "Team Netzwerk Leopoldinum" : "Vortrag: " + WORKSHOPS[p.talk].title));
    b.addEventListener("click", () => { remember("name:" + key + ":" + i); renderPerson(p); });
    return b;
  }));
  show("choose");
}

async function lookup(raw, save) {
  const err = $("err");
  err.hidden = true;
  const key = raw.trim().toLowerCase();
  if (!key) { err.textContent = "Bitte gib deinen Code oder Vornamen ein."; err.hidden = false; return false; }
  if (NAMES[key]) {
    const people = NAMES[key];
    if (people.length === 1) { if (save) remember("name:" + key + ":0"); renderPerson(people[0]); }
    else showChooser(key, people);
    return true;
  }
  const code = normalize(raw);
  let hash;
  try { hash = await sha256(code); }
  catch { err.textContent = "Dein Browser kann den Code gerade nicht prüfen. Versuche es bitte in einem anderen Browser."; err.hidden = false; return false; }
  const plan = PLANS[hash];
  if (!plan) {
    err.textContent = "Diesen Code oder Namen kennen wir nicht. Prüfe bitte die Schreibweise.";
    err.hidden = false;
    return false;
  }
  if (save) remember(code);
  render("Plan für", pretty(code), "", { kind: "student", plan });
  return true;
}

$("lookup").addEventListener("submit", (e) => { e.preventDefault(); lookup($("code").value, true); });
function logout() {
  forget();
  show("lookup");
  $("code").value = "";
  $("code").focus();
}
$("reset").addEventListener("click", logout);
$("choose-back").addEventListener("click", logout);

// Open on the login this phone used last.
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE) || localStorage.getItem("bot26-code"); } catch {}
  if (!saved) return;
  const m = /^name:([a-zäöüß]+):(\d+)$/.exec(saved);
  if (m && NAMES[m[1]] && NAMES[m[1]][+m[2]]) { renderPerson(NAMES[m[1]][+m[2]]); return; }
  if (!m && await lookup(saved, true)) return;
  forget();
  $("err").hidden = true;
})();
</script>
